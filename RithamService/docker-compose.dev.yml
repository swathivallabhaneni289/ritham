# Local development stack only. There is no production database, object-storage provider, or
# non-loopback hosting decision yet -- see README.md's "Deployment prerequisites (unresolved)"
# section. Every service here binds to 127.0.0.1 only, matching cmd/ritham-service/main.go's
# existing loopback discipline (T-04.1-01).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritham
      POSTGRES_PASSWORD: ritham
      POSTGRES_DB: ritham_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ritham-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritham -d ritham_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ritham
      MINIO_ROOT_PASSWORD: ritham-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ritham-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creation. Creates the two storage tiers plan 04.1-04 needs: the private
  # (original, EXIF-intact) tier and the shared (group-visible, stripped) tier.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RITHAM_OBJECT_STORE_BUCKET_PRIVATE: ${RITHAM_OBJECT_STORE_BUCKET_PRIVATE:-ritham-photos-private}
      RITHAM_OBJECT_STORE_BUCKET_SHARED: ${RITHAM_OBJECT_STORE_BUCKET_SHARED:-ritham-photos-shared}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ritham ritham-dev-secret &&
      mc mb -p local/$$RITHAM_OBJECT_STORE_BUCKET_PRIVATE &&
      mc mb -p local/$$RITHAM_OBJECT_STORE_BUCKET_SHARED &&
      exit 0
      "

volumes:
  ritham-postgres-data:
  ritham-minio-data:
