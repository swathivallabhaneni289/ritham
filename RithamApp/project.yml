name: Ritham
options:
  bundleIdPrefix: com.ritham
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"

packages:
  RithamCore:
    path: ../RithamCore

targets:
  Ritham:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ritham
        excludes:
          - Resources/Info.plist
    settings:
      base:
        INFOPLIST_FILE: Ritham/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ritham.app
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: RithamCore

  RithamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RithamTests
    dependencies:
      - target: Ritham
      - package: RithamCore
